<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurix</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aurix">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap">
<style>
  /* Aurix: black like the logo, with its violet-to-blue glow as the one accent. */
  :root {
    --bg: #000000;
    --panel: #0b0a16;
    --panel-2: #12101f;
    --line: #221e3a;
    --ink: #eeeaff;
    --dim: #8f8ab5;
    --violet: #8b5cf6;
    --blue: #4f7dff;
    --glow: linear-gradient(135deg, #a46bff 0%, #6a5cff 50%, #3f8cff 100%);
    --on-glow: #ffffff;
    --danger: #ff6b8a;
    --font: "Sora", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(120% 60% at 50% -10%, rgba(110, 80, 255, 0.22), transparent 60%), var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.45;
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  /* The logo sits on black; screen blending drops the black so only the glow shows. */
  .brand img { width: 40px; height: 40px; display: block; mix-blend-mode: screen; }
  h1 { font-weight: 600; font-size: 20px; letter-spacing: 0.32em; text-transform: uppercase; margin: 0; line-height: 1; }
  .clock { font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }

  /* Day picker */
  .day { display: flex; align-items: center; gap: 10px; }
  .day-label { flex: 1; text-align: center; }
  .dow { font-weight: 600; font-size: 28px; letter-spacing: -0.01em; line-height: 1.15; }
  .date { font-size: 14px; color: var(--dim); }
  .date b {
    font-weight: 600; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    background: var(--glow); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  button.nav {
    width: 46px; height: 46px; flex: 0 0 auto; border-radius: 50%; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink); font-size: 22px; line-height: 1;
  }
  button.nav:active { border-color: var(--violet); }

  /* Add a task */
  .add {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px;
  }
  .add #text { grid-column: 1 / -1; }
  input[type=text], input[type=time] {
    width: 100%; min-width: 0;
    font-family: var(--font); font-size: 17px;
    color: var(--ink); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px;
  }
  input[type=time] { font-size: 16px; min-height: 50px; -webkit-appearance: none; appearance: none; }
  input:focus-visible { outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25); }
  input::placeholder { color: var(--dim); opacity: 0.8; }
  button.primary {
    font-family: var(--font); font-weight: 600; font-size: 16px; letter-spacing: 0.02em;
    border-radius: 12px; padding: 0 24px; min-height: 50px; cursor: pointer;
    background: var(--glow); color: var(--on-glow); border: 0;
    box-shadow: 0 0 22px rgba(110, 90, 255, 0.45);
  }
  button.primary:disabled { opacity: 0.35; box-shadow: none; cursor: default; }
  button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  button.link {
    background: none; border: 0; padding: 4px 2px; cursor: pointer; align-self: center;
    font-family: var(--font); font-size: 14px; font-weight: 500; color: var(--dim);
  }

  /* Tasks */
  .list-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; }
  .list-head h2 { font-weight: 600; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); margin: 0; }
  .count { font-size: 13px; color: var(--dim); }
  ul.tasks { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ul.tasks li {
    display: flex; align-items: center; gap: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding-left: 12px;
  }
  ul.tasks label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 13px 0; cursor: pointer; }
  ul.tasks input[type=checkbox] {
    -webkit-appearance: none; appearance: none; margin: 0; flex: 0 0 auto;
    width: 24px; height: 24px; border: 2px solid #4a4470; border-radius: 50%; background: none; cursor: pointer;
    display: grid; place-content: center;
  }
  ul.tasks input[type=checkbox]:checked { background: var(--glow); border-color: transparent; box-shadow: 0 0 12px rgba(110, 90, 255, 0.6); }
  ul.tasks input[type=checkbox]:checked::after { content: "✓"; color: #fff; font-weight: 700; font-size: 14px; line-height: 1; }
  .t-time { font-size: 13px; font-weight: 600; color: #a9a0ff; min-width: 5.4em; font-variant-numeric: tabular-nums; }
  .t-text { overflow-wrap: anywhere; font-size: 16px; }
  li.done { opacity: 0.55; }
  li.done .t-text { text-decoration: line-through; }
  button.del {
    width: 44px; height: 44px; flex: 0 0 auto; border: 0; background: none; cursor: pointer; border-radius: 10px;
    color: var(--dim); font-size: 20px;
  }
  button.del.armed { color: var(--danger); font-size: 13px; font-weight: 600; width: auto; padding: 0 12px; }
  .empty { padding: 28px 4px; color: var(--dim); font-size: 15px; text-align: center; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand"><img src="logo.png" alt=""><h1>Aurix</h1></div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <div class="day">
    <button class="nav" id="prev" type="button" aria-label="Previous day">‹</button>
    <div class="day-label" aria-live="polite">
      <div class="dow" id="dow"></div>
      <div class="date" id="date"></div>
    </div>
    <button class="nav" id="next" type="button" aria-label="Next day">›</button>
  </div>
  <button class="link" id="today" type="button" hidden>Back to today</button>

  <form class="add" id="addform" autocomplete="off">
    <input id="text" type="text" placeholder="Add a task" aria-label="Task" enterkeyhint="done">
    <input id="time" type="time" aria-label="Time (optional)">
    <button class="primary" id="addbtn" type="submit" disabled>Add</button>
  </form>

  <section>
    <div class="list-head">
      <h2>Plan</h2>
      <span class="count" id="count"></span>
    </div>
    <ul class="tasks" id="list"></ul>
    <div class="empty" id="empty">Nothing planned.</div>
  </section>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };

  // ---------- storage ----------
  // Tasks live in this browser's storage, by day: { "2026-10-28": [{ id, text, time, done }] }.
  // A Home Screen app on iPhone has its own storage, separate from Safari's.
  var KEY = "pl-tasks", all = {};
  try { all = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { all = {}; }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(all)); return true; } catch (e) { return false; }
  }
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    try { all = JSON.parse(e.newValue || "{}") || {}; } catch (x) {}
    render();
  });

  // ---------- days ----------
  function dayKey(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function today() { var d = new Date(); d.setHours(12, 0, 0, 0); return d; }
  var day = today();
  function shiftDay(n) { day = new Date(day.getFullYear(), day.getMonth(), day.getDate() + n, 12); render(); }

  // ---------- rendering ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function timeText(t) {
    if (!t) return "";
    var p = t.split(":"), d = new Date(2000, 0, 1, +p[0], +p[1]);
    return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }
  // Open tasks first, timed ones in time order, then the rest as added; done tasks drop to the bottom.
  function sorted(tasks) {
    return tasks.slice().sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (!!a.time !== !!b.time) return a.time ? -1 : 1;
      if (a.time && a.time !== b.time) return a.time < b.time ? -1 : 1;
      return a.id - b.id;
    });
  }

  function render() {
    var key = dayKey(day), isToday = key === dayKey(today());
    var rel = Math.round((day - today()) / 86400000);
    $("dow").textContent = day.toLocaleDateString([], { weekday: "long" });
    $("date").innerHTML = esc(day.toLocaleDateString([], { month: "short", day: "numeric", year: day.getFullYear() === new Date().getFullYear() ? undefined : "numeric" })) +
      (isToday ? " <b>Today</b>" : rel === 1 ? " · Tomorrow" : rel === -1 ? " · Yesterday" : "");
    $("today").hidden = isToday;

    var tasks = sorted(all[key] || []), left = tasks.filter(function (t) { return !t.done; }).length;
    $("count").textContent = tasks.length ? (left ? left + " left" : "All done") : "";
    $("list").innerHTML = tasks.map(function (t) {
      return '<li' + (t.done ? ' class="done"' : '') + '><label>' +
        '<input type="checkbox" data-done="' + t.id + '"' + (t.done ? ' checked' : '') + '>' +
        (t.time ? '<span class="t-time">' + esc(timeText(t.time)) + '</span>' : '') +
        '<span class="t-text">' + esc(t.text) + '</span></label>' +
        '<button class="del" type="button" data-del="' + t.id + '" aria-label="Delete ' + esc(t.text) + '">×</button></li>';
    }).join("");
    $("empty").hidden = tasks.length > 0;
  }

  // ---------- actions ----------
  // Ids are timestamps, bumped past any already used so two quick adds can't share one.
  function nextId() {
    var id = Date.now();
    Object.keys(all).forEach(function (k) { all[k].forEach(function (t) { if (t.id >= id) id = t.id + 1; }); });
    return id;
  }
  function find(id) {
    var list = all[dayKey(day)] || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  $("text").addEventListener("input", function () { $("addbtn").disabled = !$("text").value.trim(); });
  $("addform").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = $("text").value.trim(); if (!text) return;
    var key = dayKey(day);
    (all[key] = all[key] || []).push({ id: nextId(), text: text, time: $("time").value || "", done: false });
    save();
    $("text").value = ""; $("time").value = ""; $("addbtn").disabled = true;
    render();
  });
  $("list").addEventListener("change", function (e) {
    var id = Number(e.target.getAttribute("data-done")), t = id && find(id); if (!t) return;
    t.done = e.target.checked; save(); render();
  });
  // Delete takes a second tap so a stray tap can't lose a task.
  var armTimer = null;
  $("list").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-del]"); if (!b) return;
    if (!b.classList.contains("armed")) {
      clearTimeout(armTimer); render();
      b = document.querySelector('button[data-del="' + b.getAttribute("data-del") + '"]');
      b.classList.add("armed"); b.textContent = "Delete?";
      armTimer = setTimeout(render, 3000);
      return;
    }
    clearTimeout(armTimer);
    var key = dayKey(day), id = Number(b.getAttribute("data-del"));
    all[key] = (all[key] || []).filter(function (t) { return t.id !== id; });
    if (!all[key].length) delete all[key];
    save(); render();
  });
  $("prev").addEventListener("click", function () { shiftDay(-1); });
  $("next").addEventListener("click", function () { shiftDay(1); });
  $("today").addEventListener("click", function () { day = today(); render(); });

  // ---------- clock ----------
  var shownToday = dayKey(today());
  function tick() {
    $("clock").textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    // Past midnight while open on today: move along to the new today.
    var now = dayKey(today());
    if (now !== shownToday) { if (dayKey(day) === shownToday) day = today(); shownToday = now; render(); }
  }
  tick(); setInterval(tick, 15000);

  render();
})();
</script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
