<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurix</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aurix">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap">
<style>
  /* Aurix: black like the logo, with its violet-to-blue glow as the one accent. */
  :root {
    --bg: #000000;
    --panel: #0b0a16;
    --panel-2: #12101f;
    --line: #221e3a;
    --ink: #eeeaff;
    --dim: #8f8ab5;
    --violet: #8b5cf6;
    --glow: linear-gradient(135deg, #a46bff 0%, #6a5cff 50%, #3f8cff 100%);
    --danger: #ff6b8a;
    --font: "Sora", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(120% 60% at 50% -10%, rgba(110, 80, 255, 0.22), transparent 60%), var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.45;
    padding-block: 20px 120px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  /* The logo sits on black; screen blending drops the black so only the glow shows. */
  header img { width: 40px; height: 40px; display: block; mix-blend-mode: screen; }
  h1 { font-weight: 600; font-size: 20px; letter-spacing: 0.32em; text-transform: uppercase; margin: 0; line-height: 1; }

  button { font-family: var(--font); color: inherit; }
  button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  input[type=text] {
    width: 100%; min-width: 0;
    font-family: var(--font); font-size: 16px;
    color: var(--ink); background: none; border: 0; padding: 0;
  }
  input[type=text]:focus { outline: none; }
  input::placeholder { color: var(--dim); opacity: 0.8; }

  #root { display: flex; flex-direction: column; gap: 12px; }

  /* A priority: number, name, tasks inside. */
  .prio { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; }
  .prio.top { border-color: rgba(139, 92, 246, 0.55); box-shadow: 0 0 28px rgba(110, 90, 255, 0.18); }
  .p-head { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 14px; }
  .p-title {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
    background: none; border: 0; padding: 8px 0; text-align: left; cursor: pointer;
  }
  .p-num {
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; display: grid; place-content: center;
    font-size: 14px; font-weight: 700; border: 1.5px solid #4a4470; color: var(--dim);
  }
  .top .p-num { background: var(--glow); border: 0; color: #fff; box-shadow: 0 0 14px rgba(110, 90, 255, 0.6); }
  .p-name { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
  .p-left { font-size: 13px; color: var(--dim); white-space: nowrap; margin-left: auto; padding-left: 8px; }
  .p-more {
    width: 40px; height: 40px; flex: 0 0 auto; border: 0; background: none; cursor: pointer; border-radius: 10px;
    color: var(--dim); font-size: 20px; letter-spacing: 1px;
  }
  .p-menu { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 12px; }
  .p-menu button {
    border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 7px 14px; cursor: pointer;
    font-size: 14px; font-weight: 500;
  }
  .p-menu button:disabled { opacity: 0.35; cursor: default; }
  .p-menu button.danger { color: var(--danger); }
  .p-menu button.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
  .rename { padding: 6px 14px 10px; }
  .rename input { font-size: 18px; font-weight: 600; border-bottom: 1px solid var(--violet) !important; padding-bottom: 4px; }

  ul.tasks { list-style: none; margin: 0; padding: 0 14px; }
  ul.tasks li { border-top: 1px solid var(--line); }
  ul.tasks label { display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer; }
  input[type=checkbox] {
    -webkit-appearance: none; appearance: none; margin: 0; flex: 0 0 auto;
    width: 24px; height: 24px; border: 2px solid #4a4470; border-radius: 50%; background: none; cursor: pointer;
    display: grid; place-content: center;
  }
  input[type=checkbox]:checked { background: var(--glow); border-color: transparent; box-shadow: 0 0 12px rgba(110, 90, 255, 0.6); }
  input[type=checkbox]:checked::after { content: "✓"; color: #fff; font-weight: 700; font-size: 14px; line-height: 1; }
  input[type=checkbox]:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  .t-text { overflow-wrap: anywhere; }
  li.leaving { opacity: 0.4; transition: opacity 0.4s; }
  li.leaving .t-text { text-decoration: line-through; }

  /* "Add a task" / "New priority": always there, just type. */
  form.adder { display: flex; align-items: center; gap: 12px; padding: 12px 14px 14px; border-top: 1px solid var(--line); margin: 0; }
  .plus { flex: 0 0 auto; width: 24px; text-align: center; color: var(--dim); font-size: 20px; line-height: 1; }
  form.adder button { display: none; }
  form.newprio { border: 1px dashed var(--line); border-radius: 18px; background: none; padding: 14px; }

  .welcome { text-align: center; padding: 40px 12px 8px; }
  .welcome h2 { font-size: 24px; font-weight: 600; margin: 0 0 6px; }
  .welcome p { color: var(--dim); margin: 0; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: min(448px, calc(100% - 32px));
    display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
  }
  .toast span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  .toast button {
    border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px;
    background: var(--glow); color: #fff;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <img src="logo.png" alt="">
    <h1>Aurix</h1>
  </header>
  <main id="root"></main>
</div>

<div class="toast" id="toast" role="status" hidden>
  <span id="toast-text"></span>
  <button type="button" id="undo">Undo</button>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var root = $("root");

  // ---------- storage ----------
  // Everything lives in this browser's storage. A Home Screen app on iPhone has its own
  // storage, separate from Safari's.
  // { priorities: [{ id, name, collapsed, tasks: [{ id, text }] }] } — in priority order.
  var KEY = "aurix", data = { priorities: [] };
  try { data = JSON.parse(localStorage.getItem(KEY) || "null") || data; } catch (e) {}
  if (!Array.isArray(data.priorities)) data = { priorities: [] };
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    try { data = JSON.parse(e.newValue || "null") || { priorities: [] }; } catch (x) {}
    render();
  });

  var lastId = 0;
  function newId() { var id = Date.now(); if (id <= lastId) id = lastId + 1; lastId = id; return id; }
  data.priorities.forEach(function (p) {
    lastId = Math.max(lastId, p.id);
    p.tasks.forEach(function (t) { lastId = Math.max(lastId, t.id); });
  });
  function prio(id) { return data.priorities.filter(function (p) { return p.id === id; })[0] || null; }

  // ---------- view state ----------
  var menuFor = null, renaming = null, armed = null, armTimer = null;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- rendering ----------
  function render() {
    // Keep whatever is being typed (and the cursor) across a redraw.
    var a = document.activeElement, keep = a && a.getAttribute && a.getAttribute("data-keep");
    var keepVal = keep ? a.value : "";
    var keepAll = {};
    [].forEach.call(root.querySelectorAll("input[data-keep]"), function (el) { if (el.value) keepAll[el.getAttribute("data-keep")] = el.value; });

    var ps = data.priorities;
    var html = "";
    if (!ps.length) {
      html += '<div class="welcome"><h2>What matters most?</h2><p>Name your top priority to start.</p></div>';
    }
    html += ps.map(function (p, i) {
      var n = p.tasks.length, open = !p.collapsed;
      var out = '<section class="prio' + (i === 0 ? ' top' : '') + '">' +
        '<div class="p-head">' +
          '<button class="p-title" type="button" data-act="fold" data-p="' + p.id + '" aria-expanded="' + open + '">' +
            '<span class="p-num">' + (i + 1) + '</span>' +
            '<span class="p-name">' + esc(p.name) + '</span>' +
            (open ? '' : '<span class="p-left">' + (n ? n + (n === 1 ? ' task' : ' tasks') : 'Clear') + '</span>') +
          '</button>' +
          '<button class="p-more" type="button" data-act="menu" data-p="' + p.id + '" aria-label="Options for ' + esc(p.name) + '">⋯</button>' +
        '</div>';
      if (renaming === p.id) {
        out += '<form class="rename" data-form="rename" data-p="' + p.id + '">' +
          '<input type="text" data-keep="rename" value="' + esc(p.name) + '" aria-label="Priority name" enterkeyhint="done" autocomplete="off"></form>';
      }
      if (menuFor === p.id) {
        out += '<div class="p-menu">' +
          '<button type="button" data-act="up" data-p="' + p.id + '"' + (i === 0 ? ' disabled' : '') + '>Move up</button>' +
          '<button type="button" data-act="down" data-p="' + p.id + '"' + (i === ps.length - 1 ? ' disabled' : '') + '>Move down</button>' +
          '<button type="button" data-act="rename" data-p="' + p.id + '">Rename</button>' +
          '<button type="button" class="danger' + (armed === p.id ? ' armed' : '') + '" data-act="delete" data-p="' + p.id + '">' +
            (armed === p.id ? 'Delete' + (n ? ' with ' + n + (n === 1 ? ' task' : ' tasks') : '') + '?' : 'Delete') + '</button>' +
        '</div>';
      }
      if (open) {
        out += '<ul class="tasks">' + p.tasks.map(function (t) {
          return '<li><label><input type="checkbox" data-p="' + p.id + '" data-t="' + t.id + '">' +
            '<span class="t-text">' + esc(t.text) + '</span></label></li>';
        }).join("") + '</ul>' +
        '<form class="adder" data-form="task" data-p="' + p.id + '">' +
          '<span class="plus" aria-hidden="true">+</span>' +
          '<input type="text" data-keep="task-' + p.id + '" placeholder="Add a task" aria-label="Add a task to ' + esc(p.name) + '" enterkeyhint="done" autocomplete="off">' +
          '<button type="submit">Add</button></form>';
      }
      return out + '</section>';
    }).join("");
    html += '<form class="adder newprio" data-form="prio">' +
      '<span class="plus" aria-hidden="true">+</span>' +
      '<input type="text" data-keep="prio" placeholder="' + (ps.length ? 'New priority' : 'e.g. Get the shop ready') + '" aria-label="New priority" enterkeyhint="done" autocomplete="off">' +
      '<button type="submit">Add</button></form>';
    root.innerHTML = html;

    Object.keys(keepAll).forEach(function (k) {
      var el = root.querySelector('input[data-keep="' + k + '"]'); if (el && k !== "rename") el.value = keepAll[k];
    });
    var focusEl = keep && root.querySelector('input[data-keep="' + keep + '"]');
    if (focusEl) { if (keep !== "rename") focusEl.value = keepVal; focusEl.focus(); }
    if (renaming && !focusEl) { var r = root.querySelector('input[data-keep="rename"]'); if (r) { r.focus(); r.select(); } }
  }

  // ---------- actions ----------
  root.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, input = f.querySelector("input"), text = input.value.trim();
    var kind = f.getAttribute("data-form"), p = prio(Number(f.getAttribute("data-p")));
    if (kind === "task" && p && text) {
      p.tasks.push({ id: newId(), text: text });
      input.value = "";
    } else if (kind === "prio" && text) {
      data.priorities.push({ id: newId(), name: text, collapsed: false, tasks: [] });
      input.value = "";
      // Straight into adding its first task.
      save(); render();
      var last = data.priorities[data.priorities.length - 1];
      var t = root.querySelector('input[data-keep="task-' + last.id + '"]'); if (t) t.focus();
      return;
    } else if (kind === "rename" && p) {
      if (text) p.name = text;
      renaming = null; menuFor = null;
      input.blur();
    } else return;
    save(); render();
  });

  root.addEventListener("focusout", function (e) {
    // Leaving the rename box keeps the new name.
    if (e.target.getAttribute("data-keep") === "rename" && renaming) {
      var p = prio(renaming), text = e.target.value.trim();
      if (p && text) p.name = text;
      renaming = null; menuFor = null; save();
      setTimeout(render, 0);
    }
  });

  root.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act"), id = Number(b.getAttribute("data-p")), p = prio(id);
    var ps = data.priorities, i = ps.indexOf(p);
    if (!p) return;
    if (act !== "delete") { armed = null; clearTimeout(armTimer); }
    if (act === "fold") { p.collapsed = !p.collapsed; save(); }
    else if (act === "menu") { menuFor = menuFor === id ? null : id; renaming = null; }
    else if (act === "up" && i > 0) { ps.splice(i - 1, 0, ps.splice(i, 1)[0]); save(); }
    else if (act === "down" && i < ps.length - 1) { ps.splice(i + 1, 0, ps.splice(i, 1)[0]); save(); }
    else if (act === "rename") { renaming = id; menuFor = null; }
    else if (act === "delete") {
      // Second tap deletes, so a stray tap can't lose a whole priority.
      if (armed !== id) { armed = id; clearTimeout(armTimer); armTimer = setTimeout(function () { armed = null; render(); }, 3000); }
      else {
        clearTimeout(armTimer); armed = null; menuFor = null;
        lastDone = { kind: "prio", item: p, index: i };
        ps.splice(i, 1); save(); showToast("Deleted " + p.name);
      }
    }
    render();
    if (act === "rename") { var r = root.querySelector('input[data-keep="rename"]'); if (r) { r.focus(); r.select(); } }
  });

  // Checking a task off clears it away; Undo brings it back.
  var lastDone = null, toastTimer = null;
  root.addEventListener("change", function (e) {
    var cb = e.target; if (cb.type !== "checkbox" || !cb.checked) return;
    var p = prio(Number(cb.getAttribute("data-p"))), tid = Number(cb.getAttribute("data-t"));
    if (!p) return;
    cb.closest("li").classList.add("leaving");
    setTimeout(function () {
      var i = p.tasks.findIndex(function (t) { return t.id === tid; }); if (i < 0) return;
      var t = p.tasks.splice(i, 1)[0];
      lastDone = { kind: "task", item: t, prio: p.id, index: i };
      save(); render(); showToast("Done: " + t.text);
    }, 450);
  });
  function showToast(text) {
    $("toast-text").textContent = text; $("toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { $("toast").hidden = true; lastDone = null; }, 5000);
  }
  $("undo").addEventListener("click", function () {
    var d = lastDone; if (!d) return;
    if (d.kind === "task") { var p = prio(d.prio); if (p) p.tasks.splice(Math.min(d.index, p.tasks.length), 0, d.item); }
    else data.priorities.splice(Math.min(d.index, data.priorities.length), 0, d.item);
    lastDone = null; clearTimeout(toastTimer); $("toast").hidden = true;
    save(); render();
  });

  render();
})();
</script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
