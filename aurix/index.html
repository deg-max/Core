<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurix</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aurix">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap">
<style>
  /* Aurix: black like the logo, with its violet-to-blue glow as the one accent. */
  :root {
    --bg: #000000;
    --panel: #0b0a16;
    --panel-2: #12101f;
    --line: #221e3a;
    --ink: #eeeaff;
    --dim: #8f8ab5;
    --violet: #8b5cf6;
    --glow: linear-gradient(135deg, #a46bff 0%, #6a5cff 50%, #3f8cff 100%);
    --danger: #ff6b8a;
    --font: "Sora", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(120% 60% at 50% -10%, rgba(110, 80, 255, 0.22), transparent 60%), var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.45;
    padding-block: 20px 120px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  /* The logo sits on black; screen blending drops the black so only the glow shows. */
  header img { width: 40px; height: 40px; display: block; mix-blend-mode: screen; }
  .bell {
    margin-left: auto; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: grid; place-content: center;
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
  }
  .bell.on { color: #c7bdff; border-color: rgba(139, 92, 246, 0.55); box-shadow: 0 0 14px rgba(110, 90, 255, 0.3); }
  .bell svg { display: block; }

  /* Timer alarm setup */
  .alarm { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .a-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .a-head h2 { font-size: 17px; font-weight: 600; margin: 0; }
  .alarm p { margin: 0; color: var(--dim); font-size: 14px; }
  .alarm ol { margin: 0; padding-left: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
  .alarm ol b { color: #c7bdff; font-weight: 600; }
  .switch {
    flex: 0 0 auto; width: 52px; height: 30px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel-2);
    position: relative; cursor: pointer; padding: 0;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--dim); transition: left 0.15s;
  }
  .switch[aria-checked="true"] { background: var(--glow); border-color: transparent; }
  .switch[aria-checked="true"]::after { left: 25px; background: #fff; }
  .a-btns { display: flex; gap: 8px; }
  .a-btns button {
    flex: 1; min-height: 44px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .alarm h3 { font-size: 15px; font-weight: 600; margin: 4px 0 0; }
  .alarm form.key { display: flex; gap: 8px; margin: 0; }
  .alarm form.key input {
    flex: 1; border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 10px 12px; font-size: 15px;
  }
  .alarm form.key input:focus { border-color: rgba(139, 92, 246, 0.7); }
  .alarm form.key button { flex: 0 0 auto; min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--glow); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .alarm .a-status { font-size: 13px; color: #c7bdff; }
  .alarm .a-status.err { color: #ff8a8a; }
  .alarm details summary { cursor: pointer; color: var(--dim); font-size: 14px; }
  .alarm details[open] { display: flex; flex-direction: column; gap: 10px; }
  .f-note { font-size: 13px; color: var(--dim); margin: -4px 0 0; }
  h1 { font-weight: 600; font-size: 20px; letter-spacing: 0.32em; text-transform: uppercase; margin: 0; line-height: 1; }

  button { font-family: var(--font); color: inherit; }
  button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  input[type=text] {
    width: 100%; min-width: 0;
    font-family: var(--font); font-size: 16px;
    color: var(--ink); background: none; border: 0; padding: 0;
  }
  input[type=text]:focus { outline: none; }
  input::placeholder { color: var(--dim); opacity: 0.8; }

  #root { display: flex; flex-direction: column; gap: 12px; }

  /* A priority: number, name, tasks inside. */
  .prio { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; transition: transform 0.18s ease; }
  /* Dragging: the picked-up card follows your finger; the others slide out of its way. */
  .prio.dragging {
    transition: none; z-index: 5; border-color: rgba(139, 92, 246, 0.8);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(110, 90, 255, 0.35);
  }
  .sorting, .sorting * { -webkit-user-select: none; user-select: none; }
  .p-grip {
    flex: 0 0 auto; width: 36px; height: 40px; display: grid; place-content: center; color: #5d5788;
    cursor: grab; touch-action: none;
  }
  .dragging .p-grip { cursor: grabbing; color: #c7bdff; }
  .prio.top { border-color: rgba(139, 92, 246, 0.55); box-shadow: 0 0 28px rgba(110, 90, 255, 0.18); }
  .p-head {
    display: flex; align-items: center; gap: 2px; padding: 6px 6px 6px 14px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .p-title {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
    background: none; border: 0; padding: 8px 0; text-align: left; cursor: pointer;
  }
  .p-num {
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; display: grid; place-content: center;
    font-size: 14px; font-weight: 700; border: 1.5px solid #4a4470; color: var(--dim);
  }
  .top .p-num { background: var(--glow); border: 0; color: #fff; box-shadow: 0 0 14px rgba(110, 90, 255, 0.6); }
  .p-name { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
  .p-left { font-size: 13px; color: var(--dim); white-space: nowrap; margin-left: auto; padding-left: 8px; }
  .p-more {
    width: 40px; height: 40px; flex: 0 0 auto; border: 0; background: none; cursor: pointer; border-radius: 10px;
    color: var(--dim); font-size: 20px; letter-spacing: 1px;
  }
  .p-menu { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 12px; }
  .p-menu button {
    border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 7px 14px; cursor: pointer;
    font-size: 14px; font-weight: 500;
  }
  .p-menu button:disabled { opacity: 0.35; cursor: default; }
  .p-menu button.danger { color: var(--danger); }
  .p-menu button.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
  .rename { padding: 6px 14px 10px; }
  .rename input { font-size: 18px; font-weight: 600; border-bottom: 1px solid var(--violet) !important; padding-bottom: 4px; }

  ul.tasks { list-style: none; margin: 0; padding: 0 14px; }
  ul.tasks li { border-top: 1px solid var(--line); }
  ul.tasks li { display: flex; align-items: center; gap: 8px; }
  /* The running task fills a glowing line along its bottom edge as the timer counts down. */
  ul.tasks li.running { position: relative; }
  .t-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 99px; background: var(--panel-2); overflow: hidden; pointer-events: none; }
  .t-bar i { display: block; height: 100%; background: var(--glow); box-shadow: 0 0 8px rgba(110, 90, 255, 0.8); }
  ul.tasks label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer; }

  /* Smart timer: tasks with a time in their name get a play button. */
  .play {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 6px 12px;
    font-size: 13px; font-weight: 600; color: #b9b0ff; font-variant-numeric: tabular-nums; cursor: pointer;
  }
  .play.on { background: var(--glow); color: #fff; border-color: transparent; box-shadow: 0 0 12px rgba(110, 90, 255, 0.5); }
  .focus {
    background: var(--panel); border: 1px solid rgba(139, 92, 246, 0.55); border-radius: 18px; padding: 16px;
    box-shadow: 0 0 28px rgba(110, 90, 255, 0.22); display: flex; flex-direction: column; gap: 12px;
  }
  .f-label { font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
  .f-task { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; margin-top: -6px; }
  .f-time { font-size: 56px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .focus.up .f-time { background: var(--glow); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .f-bar { height: 6px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
  .f-bar i { display: block; height: 100%; background: var(--glow); box-shadow: 0 0 10px rgba(110, 90, 255, 0.7); }
  .f-btns { display: flex; gap: 8px; }
  .f-btns button {
    flex: 1; min-height: 46px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .f-btns button.go { background: var(--glow); border: 0; color: #fff; box-shadow: 0 0 18px rgba(110, 90, 255, 0.45); }
  input[type=checkbox] {
    -webkit-appearance: none; appearance: none; margin: 0; flex: 0 0 auto;
    width: 24px; height: 24px; border: 2px solid #4a4470; border-radius: 50%; background: none; cursor: pointer;
    display: grid; place-content: center;
  }
  input[type=checkbox]:checked { background: var(--glow); border-color: transparent; box-shadow: 0 0 12px rgba(110, 90, 255, 0.6); }
  input[type=checkbox]:checked::after { content: "✓"; color: #fff; font-weight: 700; font-size: 14px; line-height: 1; }
  input[type=checkbox]:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  .t-text { overflow-wrap: anywhere; }
  li.leaving { opacity: 0.4; transition: opacity 0.4s; }
  li.leaving .t-text { text-decoration: line-through; }

  /* "Add a task" / "New priority": always there, just type. */
  form.adder { display: flex; align-items: center; gap: 12px; padding: 12px 14px 14px; border-top: 1px solid var(--line); margin: 0; }
  .plus { flex: 0 0 auto; width: 24px; text-align: center; color: var(--dim); font-size: 20px; line-height: 1; }
  form.adder button { display: none; }
  form.newprio { border: 1px dashed var(--line); border-radius: 18px; background: none; padding: 14px; }

  .welcome { text-align: center; padding: 40px 12px 8px; }
  .welcome h2 { font-size: 24px; font-weight: 600; margin: 0 0 6px; }
  .welcome p { color: var(--dim); margin: 0; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: min(448px, calc(100% - 32px));
    display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
  }
  .toast span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  .toast button {
    border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px;
    background: var(--glow); color: #fff;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <img src="logo.png" alt="">
    <h1>Aurix</h1>
    <button class="bell" id="bell" type="button" aria-label="Timer alarm settings" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>
  </header>
  <main id="root"></main>
</div>

<div class="toast" id="toast" role="status" hidden>
  <span id="toast-text"></span>
  <button type="button" id="undo">Undo</button>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var root = $("root");

  // ---------- storage ----------
  // Everything lives in this browser's storage. A Home Screen app on iPhone has its own
  // storage, separate from Safari's.
  // { priorities: [{ id, name, collapsed, tasks: [{ id, text }] }] } — in priority order.
  var KEY = "aurix", data = { priorities: [] };
  try { data = JSON.parse(localStorage.getItem(KEY) || "null") || data; } catch (e) {}
  if (!Array.isArray(data.priorities)) data = { priorities: [] };
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  // The widget experiment kept a GitHub token here; it's gone now, so don't leave it on the phone.
  try { localStorage.removeItem("aurix-sync"); } catch (e) {}
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    try { data = JSON.parse(e.newValue || "null") || { priorities: [] }; } catch (x) {}
    render();
  });

  var lastId = 0;
  function newId() { var id = Date.now(); if (id <= lastId) id = lastId + 1; lastId = id; return id; }
  data.priorities.forEach(function (p) {
    lastId = Math.max(lastId, p.id);
    p.tasks.forEach(function (t) { lastId = Math.max(lastId, t.id); });
  });
  function prio(id) { return data.priorities.filter(function (p) { return p.id === id; })[0] || null; }

  // ---------- view state ----------
  var menuFor = null, renaming = null, armed = null, armTimer = null, alarmOpen = false;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- smart timer ----------
  // A task with a length in its name ("15 minute study", "study 30 min", "1 hr workout",
  // "1h 30m", "45-minute read") gets a timer. One timer runs at a time, kept in data.timer:
  // { p, t, total, end } while running, { p, t, total, left } while paused, plus up: true once time's up.
  var H = "(?:hours|hour|hrs|hr|h)", M = "(?:minutes|minute|mins|min|m)", NUM = "(\\d+(?:\\.\\d+)?)\\s*-?\\s*";
  var reHM = new RegExp(NUM + H + "(?![a-z])(?:\\s*(?:and\\s*)?(\\d+)\\s*-?\\s*" + M + "(?![a-z]))?", "i");
  var reM = new RegExp(NUM + M + "(?![a-z])", "i");
  function taskMinutes(text) {
    var m = reHM.exec(text), mins = 0;
    if (m) mins = parseFloat(m[1]) * 60 + (m[2] ? parseInt(m[2], 10) : 0);
    else if ((m = reM.exec(text))) mins = parseFloat(m[1]);
    return mins > 0 && mins <= 720 ? mins : 0;
  }
  function durText(mins) {
    var h = Math.floor(mins / 60), m = Math.round(mins % 60);
    return h ? h + "h" + (m ? " " + m + "m" : "") : m + "m";
  }
  function clockText(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    s = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
  }
  function remaining(tm) { return tm.end ? tm.end - Date.now() : tm.left; }
  function timerTask() {
    var tm = data.timer, p = tm && prio(tm.p);
    var t = p && p.tasks.filter(function (x) { return x.id === tm.t; })[0];
    return t ? { p: p, t: t } : null;
  }

  // The chime needs a tap to unlock sound on iPhone, so starting a timer does that.
  var audio = null;
  function unlockAudio() {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  }
  function chime() {
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    if (!audio) return;
    [880, 1108.7, 1318.5].forEach(function (f, i) {
      var o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + i * 0.22;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.7);
      o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0 + 0.75);
    });
  }
  // Keep the screen on while a timer runs, where the phone allows it.
  var lock = null;
  function keepAwake(on) {
    if (on && !lock && navigator.wakeLock) {
      navigator.wakeLock.request("screen").then(function (l) { lock = l; l.addEventListener("release", function () { lock = null; }); }).catch(function () {});
    } else if (!on && lock) { lock.release(); lock = null; }
  }

  function focusHtml() {
    var tt = timerTask(), tm = data.timer;
    if (!tt) { data.timer = null; return ""; }
    var left = remaining(tm), pct = Math.min(100, Math.max(0, 100 - left / tm.total * 100));
    var id = ' data-p="' + tt.p.id + '"';
    return '<section class="focus' + (tm.up ? ' up' : '') + '">' +
      '<div class="f-label">' + (tm.up ? "Time's up" : tm.end ? "Focus" : "Paused") + '</div>' +
      '<div class="f-task">' + esc(tt.t.text) + '</div>' +
      '<div class="f-time" data-cd>' + (tm.up ? "0:00" : clockText(left)) + '</div>' +
      '<div class="f-bar"><i data-bar style="width:' + (tm.up ? 100 : pct) + '%"></i></div>' +
      (data.alarm && !tm.up ? '<p class="f-note">' + (tm.end ? 'Also counting in the Clock app.' : 'The Clock app timer is still running. Resume to reset it.') + '</p>' : '') +
      '<div class="f-btns">' + (tm.up
        ? '<button type="button" class="go" data-act="tdone"' + id + '>Done ✓</button><button type="button" data-act="tmore"' + id + '>+5 min</button>'
        : '<button type="button" data-act="tpause"' + id + '>' + (tm.end ? "Pause" : "Resume") + '</button>' +
          '<button type="button" class="go" data-act="tdone"' + id + '>Done ✓</button>') +
        '<button type="button" data-act="tstop"' + id + ' aria-label="Stop timer">Stop</button>' +
      '</div></section>';
  }
  function playLabel(p, t) {
    var tm = data.timer;
    if (tm && tm.t === t.id) return tm.up ? "Time's up" : (tm.end ? "" : "❚❚ ") + clockText(remaining(tm));
    return "▶ " + durText(taskMinutes(t.text));
  }

  // ---------- alarm through the iPhone Clock app ----------
  // A web app can't ring once it's closed, so with the alarm on, starting a timer also runs a
  // Shortcut named "Aurix Timer" that starts the iPhone's own Clock timer for the same time.
  var SHORTCUT = "Aurix Timer";
  // With an email key saved on this device, a timer instead sends an email whose subject is
  // "Aurix timer <seconds>"; an iPhone Shortcuts automation on that email starts the Clock timer.
  // That works from any device and never leaves Aurix. Email goes through Web3Forms
  // (free, sends to the address the key was made for). The key stays on this device.
  var MAILKEY = "aurix-mailkey", mailStatus = "", mailErr = false;
  function mailKey() { try { return localStorage.getItem(MAILKEY) || ""; } catch (e) { return ""; } }
  function sendTimerMail(secs, label) {
    return fetch("https://api.web3forms.com/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ access_key: mailKey(), subject: "Aurix timer " + secs, from_name: "Aurix",
        // The seconds come first in the body too, so a shortcut that reads the whole email still finds them first.
        message: secs + " seconds · " + (label || "Timer from Aurix") })
    }).then(function (r) { return r.json(); }).then(function (j) { if (!j.success) throw new Error(j.message || "Not sent"); });
  }
  function ringWithClock(ms) {
    if (!data.alarm || !(ms > 0)) return;
    var tt = timerTask(), label = tt ? tt.t.text : "";
    var secs = Math.max(1, Math.round(ms / 1000));
    if (mailKey()) {
      sendTimerMail(secs, label).catch(function (err) {
        mailStatus = "The iPhone timer email didn't send: " + err.message; mailErr = true; alarmOpen = true; render();
      });
      return;
    }
    location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(SHORTCUT) + "&input=text&text=" + secs;
  }
  function alarmHtml() {
    var key = mailKey();
    return '<section class="alarm">' +
      '<div class="a-head"><h2>Ring when time\'s up</h2>' +
        '<button type="button" class="switch" role="switch" aria-checked="' + !!data.alarm + '" aria-label="Ring with the iPhone Clock app" data-al="toggle"></button></div>' +
      '<p>Starts a timer in your iPhone\'s Clock app, so it rings even when Aurix is closed or your phone is on silent.</p>' +
      '<h3>By email: from any device, no pop-up</h3>' +
      '<form class="key" data-al-form="key"><input type="text" data-keep="mailkey" placeholder="Web3Forms access key" aria-label="Web3Forms access key" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(key) + '"><button type="submit">Save</button></form>' +
      (mailStatus ? '<p class="a-status' + (mailErr ? ' err' : '') + '">' + esc(mailStatus) + '</p>' : '') +
      '<p>Get a key:</p>' +
      '<ol>' +
        '<li>Go to <b>web3forms.com</b>, enter your <b>iCloud</b> email, and tap <b>Create Access Key</b>.</li>' +
        '<li>Copy the key from their email, paste it above and tap <b>Save</b>. Do this on each device you use Aurix on.</li>' +
      '</ol>' +
      '<p>Make the automation on your iPhone (iOS 17 or later):</p>' +
      '<ol>' +
        '<li>Open <b>Shortcuts</b> and tap <b>Automation</b> at the bottom.</li>' +
        '<li>Tap <b>+</b> (or <b>New Automation</b>), scroll down and choose <b>Email</b>.</li>' +
        '<li>Tap <b>Subject Contains</b>, type <b>Aurix timer</b> and tap <b>Done</b>. Leave Sender and Account as they are.</li>' +
        '<li>Choose <b>Run Immediately</b> and turn off <b>Notify When Run</b>. Tap <b>Next</b>, then <b>New Blank Automation</b>.</li>' +
        '<li>Tap <b>Add Action</b>, search for <b>Get Numbers from Input</b> and add it.</li>' +
        '<li>Tap its blue <b>Input</b>, choose <b>Shortcut Input</b>. Then tap <b>Shortcut Input</b> again and pick <b>Subject</b> if it\'s listed (if not, leave it).</li>' +
        '<li>Add <b>Get Item from List</b>. It should read <b>Get First Item from Numbers</b>.</li>' +
        '<li>Add <b>Start Timer</b>. Tap its number and choose <b>Item from List</b>. Tap the unit and choose <b>seconds</b>.</li>' +
        '<li>Tap <b>Done</b> (top right).</li>' +
      '</ol>' +
      '<p>Then tap <b>Test: 10 seconds</b> below and lock your phone: a 10-second timer should start within a few seconds. If the email lands in Junk, mark it <b>Not Junk</b> and test again.</p>' +
      (key ? '' :
      '<details><summary>Or, on this iPhone only: run a Shortcut</summary>' +
        '<p>Each timer briefly opens Shortcuts; swipe back to Aurix.</p>' +
        '<ol>' +
          '<li>Open the <b>Shortcuts</b> app and tap <b>+</b>.</li>' +
          '<li>Name it <b>Aurix Timer</b>, exactly.</li>' +
          '<li>Add the action <b>Start Timer</b>.</li>' +
          '<li>Tap its number and choose <b>Shortcut Input</b>. Tap the unit and choose <b>seconds</b>.</li>' +
          '<li>Tap <b>Done</b>, then test it here.</li>' +
        '</ol></details>') +
      '<p>Pausing or stopping in Aurix can\'t stop the Clock timer. Cancel it in the Clock app if you need to.</p>' +
      '<div class="a-btns"><button type="button" data-al="test">' + (key ? 'Test: 10 seconds' : 'Test: 5 seconds') + '</button><button type="button" data-al="close">Close</button></div>' +
    '</section>';
  }
  root.addEventListener("submit", function (e) {
    if (!e.target.matches('form[data-al-form="key"]')) return;
    e.preventDefault(); e.stopPropagation();
    var v = e.target.querySelector("input").value.trim();
    try { if (v) localStorage.setItem(MAILKEY, v); else localStorage.removeItem(MAILKEY); } catch (err) {}
    mailStatus = v ? "Saved on this device. Timers will email your iPhone." : "Removed. Timers use the Shortcut on this iPhone.";
    mailErr = false; render();
  }, true);
  $("bell").addEventListener("click", function () { alarmOpen = !alarmOpen; render(); if (alarmOpen) window.scrollTo({ top: 0, behavior: "smooth" }); });
  root.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-al]"); if (!b) return;
    var al = b.getAttribute("data-al");
    if (al === "toggle") { data.alarm = !data.alarm; save(); render(); }
    else if (al === "close") { alarmOpen = false; render(); }
    else if (al === "test") {
      if (!mailKey()) { location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(SHORTCUT) + "&input=text&text=5"; return; }
      mailStatus = "Sending…"; mailErr = false; render();
      sendTimerMail(10, "Test from Aurix").then(function () {
        mailStatus = "Sent. Your iPhone should start a 10-second timer when the email arrives.";
      }, function (err) {
        mailStatus = "Didn't send: " + err.message; mailErr = true;
      }).then(render);
    }
  });

  function timerPct() {
    var tm = data.timer;
    return !tm ? 0 : tm.up ? 100 : Math.min(100, Math.max(0, 100 - remaining(tm) / tm.total * 100));
  }
  // The window title carries the countdown, so it shows in the app switcher and the desktop window.
  function setTitle() {
    var tm = data.timer;
    document.title = !tm ? "Aurix" : tm.up ? "Time's up · Aurix" : (tm.end ? "" : "❚❚ ") + clockText(remaining(tm)) + " · Aurix";
  }

  // Runs a few times a second: just the numbers, so typing elsewhere isn't disturbed.
  function tick() {
    var tm = data.timer;
    setTitle();
    if (!tm || tm.up) return;
    var left = remaining(tm);
    if (tm.end && left <= 0) {
      tm.up = true; tm.end = null; tm.left = 0; save(); render(); chime();
      return;
    }
    var cd = root.querySelector("[data-cd]"), row = root.querySelector('.play[data-t="' + tm.t + '"]');
    if (cd) cd.textContent = clockText(left);
    [].forEach.call(root.querySelectorAll("[data-bar], [data-rowbar]"), function (b) { b.style.width = timerPct() + "%"; });
    if (row) row.textContent = (tm.end ? "" : "❚❚ ") + clockText(left);
  }
  setInterval(tick, 250);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { tick(); keepAwake(!!(data.timer && data.timer.end)); }
  });

  // ---------- rendering ----------
  function render() {
    // Keep whatever is being typed (and the cursor) across a redraw.
    var a = document.activeElement, keep = a && a.getAttribute && a.getAttribute("data-keep");
    var keepVal = keep ? a.value : "";
    var keepAll = {};
    [].forEach.call(root.querySelectorAll("input[data-keep]"), function (el) { if (el.value) keepAll[el.getAttribute("data-keep")] = el.value; });

    var ps = data.priorities;
    var html = (alarmOpen ? alarmHtml() : "") + (data.timer ? focusHtml() : "");
    $("bell").classList.toggle("on", !!data.alarm);
    $("bell").setAttribute("aria-expanded", alarmOpen);
    keepAwake(!!(data.timer && data.timer.end));
    if (!ps.length) {
      html += '<div class="welcome"><h2>What matters most?</h2><p>Name your top priority to start.</p></div>';
    }
    html += ps.map(function (p, i) {
      var n = p.tasks.length, open = !p.collapsed;
      var out = '<section class="prio' + (i === 0 ? ' top' : '') + '">' +
        '<div class="p-head">' +
          '<button class="p-title" type="button" data-act="fold" data-p="' + p.id + '" aria-expanded="' + open + '">' +
            '<span class="p-num">' + (i + 1) + '</span>' +
            '<span class="p-name">' + esc(p.name) + '</span>' +
            (open ? '' : '<span class="p-left">' + (n ? n + (n === 1 ? ' task' : ' tasks') : 'Clear') + '</span>') +
          '</button>' +
          (ps.length > 1 ? '<span class="p-grip" aria-hidden="true" title="Drag to reorder">' +
            '<svg width="14" height="20" viewBox="0 0 14 20" fill="currentColor"><circle cx="4" cy="4" r="1.8"/><circle cx="10" cy="4" r="1.8"/><circle cx="4" cy="10" r="1.8"/><circle cx="10" cy="10" r="1.8"/><circle cx="4" cy="16" r="1.8"/><circle cx="10" cy="16" r="1.8"/></svg></span>' : '') +
          '<button class="p-more" type="button" data-act="menu" data-p="' + p.id + '" aria-label="Options for ' + esc(p.name) + '">⋯</button>' +
        '</div>';
      if (renaming === p.id) {
        out += '<form class="rename" data-form="rename" data-p="' + p.id + '">' +
          '<input type="text" data-keep="rename" value="' + esc(p.name) + '" aria-label="Priority name" enterkeyhint="done" autocomplete="off"></form>';
      }
      if (menuFor === p.id) {
        out += '<div class="p-menu">' +
          '<button type="button" data-act="up" data-p="' + p.id + '"' + (i === 0 ? ' disabled' : '') + '>Move up</button>' +
          '<button type="button" data-act="down" data-p="' + p.id + '"' + (i === ps.length - 1 ? ' disabled' : '') + '>Move down</button>' +
          '<button type="button" data-act="rename" data-p="' + p.id + '">Rename</button>' +
          '<button type="button" class="danger' + (armed === p.id ? ' armed' : '') + '" data-act="delete" data-p="' + p.id + '">' +
            (armed === p.id ? 'Delete' + (n ? ' with ' + n + (n === 1 ? ' task' : ' tasks') : '') + '?' : 'Delete') + '</button>' +
        '</div>';
      }
      if (open) {
        out += '<ul class="tasks">' + p.tasks.map(function (t) {
          var timed = taskMinutes(t.text) > 0, on = data.timer && data.timer.t === t.id;
          return '<li' + (on ? ' class="running"' : '') + '><label><input type="checkbox" data-p="' + p.id + '" data-t="' + t.id + '">' +
            '<span class="t-text">' + esc(t.text) + '</span></label>' +
            (timed ? '<button type="button" class="play' + (on ? ' on' : '') + '" data-act="play" data-p="' + p.id + '" data-t="' + t.id + '"' +
              ' aria-label="' + (on ? 'Pause or resume timer' : 'Start ' + durText(taskMinutes(t.text)) + ' timer') + '">' + esc(playLabel(p, t)) + '</button>' : '') +
            (on ? '<span class="t-bar" aria-hidden="true"><i data-rowbar style="width:' + timerPct() + '%"></i></span>' : '') +
            '</li>';
        }).join("") + '</ul>' +
        '<form class="adder" data-form="task" data-p="' + p.id + '">' +
          '<span class="plus" aria-hidden="true">+</span>' +
          '<input type="text" data-keep="task-' + p.id + '" placeholder="Add a task" aria-label="Add a task to ' + esc(p.name) + '" enterkeyhint="done" autocomplete="off">' +
          '<button type="submit">Add</button></form>';
      }
      return out + '</section>';
    }).join("");
    html += '<form class="adder newprio" data-form="prio">' +
      '<span class="plus" aria-hidden="true">+</span>' +
      '<input type="text" data-keep="prio" placeholder="' + (ps.length ? 'New priority' : 'e.g. Get the shop ready') + '" aria-label="New priority" enterkeyhint="done" autocomplete="off">' +
      '<button type="submit">Add</button></form>';
    root.innerHTML = html;

    Object.keys(keepAll).forEach(function (k) {
      var el = root.querySelector('input[data-keep="' + k + '"]'); if (el && k !== "rename") el.value = keepAll[k];
    });
    var focusEl = keep && root.querySelector('input[data-keep="' + keep + '"]');
    if (focusEl) { if (keep !== "rename") focusEl.value = keepVal; focusEl.focus(); }
    if (renaming && !focusEl) { var r = root.querySelector('input[data-keep="rename"]'); if (r) { r.focus(); r.select(); } }
  }

  // ---------- drag to reorder ----------
  // Grab a priority by its grip, or press and hold its name, then drag it up or down.
  var drag = null, press = null, pressTimer = null, ignoreClick = false, GAP = 12;
  root.addEventListener("pointerdown", function (e) {
    if (drag || (e.pointerType === "mouse" && e.button !== 0)) return;
    var grip = e.target.closest(".p-grip"), head = e.target.closest(".p-title");
    var card = e.target.closest(".prio");
    if (!card || (!grip && !head)) return;
    if (grip) { e.preventDefault(); startDrag(card, e.clientY); return; }
    // Holding still on the name picks the card up; moving first means you're scrolling.
    press = { card: card, x: e.clientX, y: e.clientY };
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function () { if (press) startDrag(press.card, press.y); press = null; }, 380);
  });
  window.addEventListener("pointermove", function (e) {
    if (press && Math.abs(e.clientX - press.x) + Math.abs(e.clientY - press.y) > 8) { clearTimeout(pressTimer); press = null; }
    if (drag) { e.preventDefault(); drag.y = e.clientY; layoutDrag(); }
  });
  window.addEventListener("pointerup", endPress);
  window.addEventListener("pointercancel", endPress);
  function endPress() { clearTimeout(pressTimer); press = null; if (drag) endDrag(); }
  // Stop the page scrolling under your finger while a card is picked up.
  document.addEventListener("touchmove", function (e) { if (drag) e.preventDefault(); }, { passive: false });
  // The tap that ends a drag shouldn't also fold the card.
  root.addEventListener("click", function (e) { if (ignoreClick) { e.stopPropagation(); e.preventDefault(); } }, true);

  function startDrag(card, y) {
    var cards = [].slice.call(root.querySelectorAll(".prio"));
    if (cards.length < 2) return;
    var from = cards.indexOf(card);
    drag = {
      card: card, cards: cards, from: from, to: from, y: y, startY: y, startScroll: window.scrollY,
      rects: cards.map(function (c) { var r = c.getBoundingClientRect(); return { top: r.top + window.scrollY, height: r.height }; })
    };
    ignoreClick = true;
    card.classList.add("dragging"); root.classList.add("sorting");
    if (navigator.vibrate) navigator.vibrate(12);
    layoutDrag();
    requestAnimationFrame(autoScroll);
  }
  function layoutDrag() {
    var d = drag, me = d.rects[d.from];
    var dy = d.y + window.scrollY - d.startY - d.startScroll;
    d.card.style.transform = "translateY(" + dy + "px) scale(1.02)";
    var center = me.top + me.height / 2 + dy, to = 0;
    d.rects.forEach(function (r, i) { if (i !== d.from && r.top + r.height / 2 < center) to++; });
    d.to = to;
    var shift = me.height + GAP, order = [];
    d.cards.forEach(function (c, i) {
      if (i === d.from) return;
      var s = 0;
      if (d.from < to && i > d.from && i <= to) s = -shift;
      if (d.from > to && i >= to && i < d.from) s = shift;
      c.style.transform = s ? "translateY(" + s + "px)" : "";
      order.push(c);
    });
    // Numbers follow the new order as you drag.
    order.splice(to, 0, d.card);
    order.forEach(function (c, i) { c.querySelector(".p-num").textContent = i + 1; c.classList.toggle("top", i === 0); });
  }
  function autoScroll() {
    if (!drag) return;
    var edge = 80, v = 0;
    if (drag.y < edge) v = -Math.ceil((edge - drag.y) / 6);
    else if (drag.y > window.innerHeight - edge) v = Math.ceil((drag.y - (window.innerHeight - edge)) / 6);
    if (v) { window.scrollBy(0, v); layoutDrag(); }
    requestAnimationFrame(autoScroll);
  }
  function endDrag() {
    var d = drag; drag = null;
    root.classList.remove("sorting");
    d.cards.forEach(function (c) { c.style.transform = ""; c.classList.remove("dragging"); });
    if (d.to !== d.from) {
      var ps = data.priorities;
      ps.splice(d.to, 0, ps.splice(d.from, 1)[0]);
      save();
    }
    render();
    setTimeout(function () { ignoreClick = false; }, 60);
  }

  // ---------- actions ----------
  root.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, input = f.querySelector("input"), text = input.value.trim();
    var kind = f.getAttribute("data-form"), p = prio(Number(f.getAttribute("data-p")));
    if (kind === "task" && p && text) {
      p.tasks.push({ id: newId(), text: text });
      input.value = "";
    } else if (kind === "prio" && text) {
      data.priorities.push({ id: newId(), name: text, collapsed: false, tasks: [] });
      input.value = "";
      // Straight into adding its first task.
      save(); render();
      var last = data.priorities[data.priorities.length - 1];
      var t = root.querySelector('input[data-keep="task-' + last.id + '"]'); if (t) t.focus();
      return;
    } else if (kind === "rename" && p) {
      if (text) p.name = text;
      renaming = null; menuFor = null;
      input.blur();
    } else return;
    save(); render();
  });

  root.addEventListener("focusout", function (e) {
    // Leaving the rename box keeps the new name.
    if (e.target.getAttribute("data-keep") === "rename" && renaming) {
      var p = prio(renaming), text = e.target.value.trim();
      if (p && text) p.name = text;
      renaming = null; menuFor = null; save();
      setTimeout(render, 0);
    }
  });

  root.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act"), id = Number(b.getAttribute("data-p")), p = prio(id);
    var ps = data.priorities, i = ps.indexOf(p);
    if (!p) return;
    if (act !== "delete") { armed = null; clearTimeout(armTimer); }
    if (act === "fold") { p.collapsed = !p.collapsed; save(); }
    else if (act === "menu") { menuFor = menuFor === id ? null : id; renaming = null; }
    else if (act === "up" && i > 0) { ps.splice(i - 1, 0, ps.splice(i, 1)[0]); save(); }
    else if (act === "down" && i < ps.length - 1) { ps.splice(i + 1, 0, ps.splice(i, 1)[0]); save(); }
    else if (act === "rename") { renaming = id; menuFor = null; }
    else if (act === "play") {
      var tid = Number(b.getAttribute("data-t")), task = p.tasks.filter(function (x) { return x.id === tid; })[0];
      var tm = data.timer;
      if (tm && tm.t === tid && !tm.up) togglePause(tm);
      else if (task) {
        // Starting another task's timer replaces the one running.
        unlockAudio();
        var total = taskMinutes(task.text) * 60000;
        data.timer = { p: p.id, t: tid, total: total, end: Date.now() + total, left: null, up: false };
        save(); ringWithClock(total);
      }
      save();
    }
    else if (act === "tpause" && data.timer) { togglePause(data.timer); save(); }
    else if (act === "tmore" && data.timer) {
      unlockAudio();
      data.timer = { p: data.timer.p, t: data.timer.t, total: 300000, end: Date.now() + 300000, left: null, up: false }; save();
      ringWithClock(300000);
    }
    else if (act === "tstop") { data.timer = null; save(); }
    else if (act === "tdone" && data.timer) { var dt = data.timer.t; data.timer = null; completeTask(p, dt); return; }
    else if (act === "delete") {
      // Second tap deletes, so a stray tap can't lose a whole priority.
      if (armed !== id) { armed = id; clearTimeout(armTimer); armTimer = setTimeout(function () { armed = null; render(); }, 3000); }
      else {
        clearTimeout(armTimer); armed = null; menuFor = null;
        if (data.timer && data.timer.p === id) data.timer = null;
        lastDone = { kind: "prio", item: p, index: i };
        ps.splice(i, 1); save(); showToast("Deleted " + p.name);
      }
    }
    render();
    if (act === "rename") { var r = root.querySelector('input[data-keep="rename"]'); if (r) { r.focus(); r.select(); } }
  });

  // Checking a task off clears it away; Undo brings it back.
  var lastDone = null, toastTimer = null;
  root.addEventListener("change", function (e) {
    var cb = e.target; if (cb.type !== "checkbox" || !cb.checked) return;
    var p = prio(Number(cb.getAttribute("data-p"))), tid = Number(cb.getAttribute("data-t"));
    if (!p) return;
    cb.closest("li").classList.add("leaving");
    if (data.timer && data.timer.t === tid) data.timer = null;
    setTimeout(function () { completeTask(p, tid); }, 450);
  });
  function completeTask(p, tid) {
    var i = p.tasks.findIndex(function (t) { return t.id === tid; }); if (i < 0) return;
    var t = p.tasks.splice(i, 1)[0];
    lastDone = { kind: "task", item: t, prio: p.id, index: i };
    save(); render(); showToast("Done: " + t.text);
  }
  function togglePause(tm) {
    if (tm.end) { tm.left = tm.end - Date.now(); tm.end = null; }
    else { unlockAudio(); tm.end = Date.now() + tm.left; tm.left = null; save(); ringWithClock(tm.end - Date.now()); }
  }
  function showToast(text) {
    $("toast-text").textContent = text; $("toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { $("toast").hidden = true; lastDone = null; }, 5000);
  }
  $("undo").addEventListener("click", function () {
    var d = lastDone; if (!d) return;
    if (d.kind === "task") { var p = prio(d.prio); if (p) p.tasks.splice(Math.min(d.index, p.tasks.length), 0, d.item); }
    else data.priorities.splice(Math.min(d.index, data.priorities.length), 0, d.item);
    lastDone = null; clearTimeout(toastTimer); $("toast").hidden = true;
    save(); render();
  });

  render();
})();
</script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
